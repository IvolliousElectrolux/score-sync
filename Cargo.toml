[package]
name = "score_sync"
version = "1.3.3"
edition = "2021"
description = "方便曲谱同步一条龙制作的 Rust GPUI 工具"
license = "MIT"

[dependencies]
async-channel = "2"
clap = { version = "4", features = ["derive"] }
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
mask_tool = { path = "crates/mask_tool" }
apply_bg = { path = "crates/apply_bg" }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_6406", "image", "thread_safe"] }
rfd = "0.15"
score_video = { path = "crates/score_video" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"

[build-dependencies]
embed-resource = "3"

# 日常 `cargo run -r`: 够快, 链接不再拖到数分钟.
[profile.release]
lto = false
codegen-units = 16
opt-level = 3
strip = true

# 最终发包再开满优化: cargo build --profile release-max
[profile.release-max]
inherits = "release"
lto = true
codegen-units = 1
