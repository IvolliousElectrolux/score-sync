# 推送时做格式检查、clippy 和库测试. 发行包仍由 windows.yml / macos.yml 在打标签时编.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check

      - name: Format
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Test libraries
        run: cargo test --workspace --lib

      - name: Check app
        run: cargo check -p score_sync

      - name: Clippy
        continue-on-error: true
        run: cargo clippy -p score_sync --all-targets -- -W clippy::all
