# macOS 发行包: 在 GitHub 的 Mac runner 上编译 (维护者没有本地 Mac).
# 两个架构都在 macos-14 上编 (arm64 本机, x86_64 交叉), 避开排队极久的 macos-13.
# 触发: 推送 v* 标签, 或 Actions 页手动 workflow_dispatch (可填已有 tag 把 zip 挂上去).

name: macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "挂到已有 Release 的标签 (如 v1.3.7); 留空只上传 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: macos-arm64
            pdfium: mac-arm64
            ffmpeg: darwin-arm64
          - target: x86_64-apple-darwin
            asset: macos-x64
            pdfium: mac-x64
            ffmpeg: darwin-x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.asset }}

      - name: Build score_sync
        run: cargo build -r -p score_sync --target ${{ matrix.target }}

      - name: Bundle ffmpeg, pdfium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          STAGE="score_sync-${VER}-${{ matrix.asset }}"
          BIN="target/${{ matrix.target }}/release/score_sync"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          chmod +x "$STAGE/score_sync"

          echo "download pdfium ${{ matrix.pdfium }} (chromium/6406, matches pdfium-render)"
          curl -fsSL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F6406/pdfium-${{ matrix.pdfium }}.tgz"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          DYLIB=$(find pdfium-extract -name 'libpdfium.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" "$STAGE/libpdfium.dylib"

          echo "download ffmpeg ${{ matrix.ffmpeg }}"
          curl -fsSL -o ffmpeg.gz \
            "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-${{ matrix.ffmpeg }}.gz"
          gunzip -c ffmpeg.gz > "$STAGE/ffmpeg"
          chmod +x "$STAGE/ffmpeg"

          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "${STAGE}.zip"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -lh "${STAGE}.zip" "$STAGE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: ${{ env.STAGE }}.zip

      - name: Attach zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "no release tag; skip attach"
            exit 0
          fi
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $TAG ($i)"
            sleep 15
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Score Sync ${TAG}"
          fi
          gh release upload "$TAG" "${STAGE}.zip" --clobber

  warp-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build warp_staffcrop_timeline
        run: |
          set -euo pipefail
          python3 -c "import tkinter"
          python3 -m pip install -U pip pyinstaller
          python3 -m PyInstaller --noconfirm --windowed --onefile \
            --name warp_staffcrop_timeline \
            tools/warp_staffcrop_timeline.py
          VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          STAGE="warp_staffcrop_timeline-${VER}-macos-arm64"
          mkdir -p "$STAGE"
          cp dist/warp_staffcrop_timeline "$STAGE/"
          chmod +x "$STAGE/warp_staffcrop_timeline"
          cp tools/warp_staffcrop_timeline.py "$STAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "${STAGE}.zip"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -lh "${STAGE}.zip" "$STAGE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: ${{ env.STAGE }}.zip

      - name: Attach zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "no release tag; skip attach"
            exit 0
          fi
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $TAG ($i)"
            sleep 15
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Score Sync ${TAG}"
          fi
          gh release upload "$TAG" "${STAGE}.zip" --clobber
