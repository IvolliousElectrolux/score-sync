[package]
name = "score_video"
version = "1.2.8"
edition = "2021"
description = "谱面同步视频轨道编辑与 ffmpeg 导出 (GPUI)"

[dependencies]
apply_bg = { path = "../apply_bg" }
async-channel = "2"
clap = { version = "4", features = ["derive"] }
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
hound = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
rfd = "0.15"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
smallvec = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
