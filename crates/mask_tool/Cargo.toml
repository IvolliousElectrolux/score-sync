[package]
name = "mask_tool"
version = "0.1.0"
edition = "2021"
description = "半透明白色蒙版工具 (GPUI)"

[dependencies]
clap = { version = "4", features = ["derive"] }
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
smallvec = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
