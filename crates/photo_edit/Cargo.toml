[package]
name = "photo_edit"
version.workspace = true
edition.workspace = true
description = "谱面分块 P 图 (图层 / 裁切 / 修复, GPUI)"
license.workspace = true

[dependencies]
async-channel = "2"
clap = { version = "4", features = ["derive"] }
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest", "font-kit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
apply_bg = { path = "../apply_bg" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
